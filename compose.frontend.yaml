services:
  frontend:
    image: ${FRONTEND_IMAGE}
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - app
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --tries=1
        - --spider
        - http://127.0.0.1:3000/health
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    stop_grace_period: 30s
    deploy:
      mode: replicated
      replicas: 3
      endpoint_mode: vip
      update_config:
        parallelism: 1
        order: start-first
        monitor: 90s
        delay: 5s
        failure_action: rollback
      rollback_config:
        parallelism: 1
        order: start-first
        monitor: 90s
        delay: 5s
        failure_action: pause
      restart_policy:
        condition: on-failure
        delay: 3s
        max_attempts: 3
      resources:
        limits:
          cpus: "0.30"
          memory: 200M
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    environment:
      INTERNAL_BACKEND_BASE_URL: ${INTERNAL_BACKEND_BASE_URL}
      NEXT_PUBLIC_BACKEND_BASE_URL: ${NEXT_PUBLIC_BACKEND_BASE_URL}
      NEXT_PUBLIC_FILES_PROTOCOL: ${NEXT_PUBLIC_FILES_PROTOCOL}
      NEXT_PUBLIC_FILES_HOST: ${NEXT_PUBLIC_FILES_HOST}

networks:
  frontend:
    name: frontend
    external: true
  app:
    name: app
    external: true
